spring.application.name=APIGateway
server.port=7000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.ip-address=true

spring.cloud.gateway.routes[0].id=AuthService
spring.cloud.gateway.routes[0].uri=lb://AuthService
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=ComplaintService
spring.cloud.gateway.routes[1].uri=lb://ComplaintService
spring.cloud.gateway.routes[1].predicates[0]=Path=/complaints/**

spring.cloud.gateway.routes[2].id=AssignmentService
spring.cloud.gateway.routes[2].uri=lb://AssignmentService
spring.cloud.gateway.routes[2].predicates[0]=Path=/assignments/**